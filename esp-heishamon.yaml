    name: "Pression d'eau"  # Water Pressure (TOP115)

  # ============== POWER SENSORS ==============
  - platform: heishamon
    heishamon_id: heisha_main
    topic: "heat_power_production"
    name: "Puissance chauffage produite"  # Heat Power Production (TOP15)
    id: heat_power_production_sensor

  - platform: heishamon
    heishamon_id: heisha_main
    topic: "heat_power_consumption"
    name: "Puissance chauffage consommée"  # Heat Power Consumption (TOP16)
    id: heat_power_consumption_sensor

  - platform: heishamon
    heishamon_id: heisha_main
    topic: "dhw_power_production"
    name: "Puissance ECS produite"  # DHW Power Production (TOP40)
    id: dhw_power_production_sensor

  - platform: heishamon
    heishamon_id: heisha_main
    topic: "dhw_power_consumption"
    name: "Puissance ECS consommée"  # DHW Power Consumption (TOP41)
    id: dhw_power_consumption_sensor

  # ============== ENERGY INTEGRATION (kWh from power sensors) ==============
  # These sensors integrate power over time to calculate total energy consumption/production

  # Heat Energy Consumption (integrates TOP16)
  - platform: integration
    name: "Énergie chauffage consommée"  # Heat Energy Consumption
    sensor: heat_power_consumption_sensor
    time_unit: h
    unit_of_measurement: "Wh"
    state_class: total_increasing
    device_class: energy
    accuracy_decimals: 3

  # Heat Energy Production (integrates TOP15)
  - platform: integration
    name: "Énergie chauffage produite"  # Heat Energy Production
    sensor: heat_power_production_sensor
    time_unit: h
    unit_of_measurement: "Wh"
    state_class: total_increasing
    device_class: energy
    accuracy_decimals: 3

  # DHW Energy Consumption (integrates TOP41)
  - platform: integration
    name: "Énergie ECS consommée"  # DHW Energy Consumption
    sensor: dhw_power_consumption_sensor
    time_unit: h
    unit_of_measurement: "Wh"
    state_class: total_increasing
    device_class: energy
    accuracy_decimals: 3

  # DHW Energy Production (integrates TOP40)
  - platform: integration
    name: "Énergie ECS produite"  # DHW Energy Production
    sensor: dhw_power_production_sensor
    time_unit: h
    unit_of_measurement: "Wh"
    state_class: total_increasing
    device_class: energy
    accuracy_decimals: 3

