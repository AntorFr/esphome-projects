    name: "Température refoulement"  # Discharge Temperature (TOP50)

  - platform: heishamon
    heishamon_id: heisha_main
    topic: "inside_pipe_temp"
    name: "Température tuyauterie intérieure"  # Inside Pipe Temperature (TOP51)

  - platform: heishamon
