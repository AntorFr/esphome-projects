substitutions:
  device_name: esp-heishamon
  friendly_name: Pompe à chaleur Garage
  area: "Garage 1"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  area: ${area}
  comment: HeishaMon protocol v4.1.6 (active mode)
  on_boot:
    priority: -100  # Run after everything is initialized
    then:
      - delay: 15s  # Wait longer for API to stabilize before starting protocol
      - logger.log: "HeishaMon ready - starting data collection"

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  framework:
    type: esp-idf


# Configuration for W5500 Ethernet module
ethernet:
  type: W5500
  clk_pin: GPIO12    # ETH_SPI_SCK
  mosi_pin: GPIO11   # ETH_SPI_MOSI
  miso_pin: GPIO13   # ETH_SPI_MISO
  cs_pin: GPIO10     # ETH_CS
  interrupt_pin: GPIO15  # ETH_IRQ
  reset_pin: GPIO14  # ETH_RST
  clock_speed: 26.67MHz
  use_address: ${device_name}.intra.sberard.fr.

# Enable Home Assistant API
api:
  #encryption:
  #  key: !secret api_encryption

ota:
  platform: esphome
  password: !secret ota_password

logger:
  level: DEBUG
  logs:
    heishamon: DEBUG
    heishamon.number: DEBUG
    api: DEBUG  # Masquer les erreurs API
    api.connection: DEBUG  # Masquer aussi les erreurs de connexion


#######################################
# Device specific Config Begins Below #
#######################################
packages:
  device_base_eth: !include packages/device_base_eth.yaml

# Status LED configuration
light:
  - platform: esp32_rmt_led_strip
    rgb_order: GRB
    pin: GPIO42
    num_leds: 1
    chipset: ws2812
    name: "Status LED"
    id: status_led

# Relay configuration
#switch:
#  - platform: gpio
#    pin: GPIO21
#    name: "Relay 1"
#    id: relay_1
#    restore_mode: RESTORE_DEFAULT_OFF
#
#  - platform: gpio
#    pin: GPIO47
#    name: "Relay 2"
#    id: relay_2
#    restore_mode: RESTORE_DEFAULT_OFF

external_components:
  - source:
      type: git
      url: https://github.com/AntorFr/esphome-heishamon.git
      ref: dev
    components: [heishamon]
    refresh: 0s

uart:
  id: heisha_uart
  tx_pin: GPIO17     # TX pin for ESP32
  rx_pin: GPIO18     # RX pin for ESP32
  baud_rate: 9600
  parity: EVEN
  stop_bits: 1

heishamon:
  id: heisha_main
  uart_id: heisha_uart
  update_interval: 30s
  # Active mode: the ESP is wired to CN-CNT and polls the pump itself
  # (HeishaMon removed from the bus on 2026-08-10)
  listen_only: false
  optional_pcb: false
  # HeishaMon ESP32 board: GPIO5 gates the CN-CNT TX driver (ENABLEPIN)
  tx_enable_pin: GPIO5



